<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetingLock - Laptop Host QR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; color: #1a237e; display: flex; justify-content: center; padding: 32px; }
    .card { background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 440px; width: 100%; text-align: center; }
    h1 { margin-top: 0; font-size: 24px; }
    p { color: #546e7a; font-size: 14px; }
    input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #cfd8dc; border-radius: 8px; box-sizing: border-box; margin: 12px 0; }
    button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; color: #fff; }
    .btn-lock { background: #2e7d32; }
    .btn-unlock { background: #ef6c00; display: none; }
    #qrContainer { display: flex; justify-content: center; margin-top: 20px; }
    #qrStatus { font-weight: 700; margin-top: 14px; color: #263238; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MeetingLock Host (Browser)</h1>
    <p>Open this on your laptop so you can test scanning Lock &amp; Unlock QR codes with a single Pixel 7a.</p>
    <label for="minutes"><strong>Session Duration (minutes)</strong></label>
    <input id="minutes" type="number" min="1" max="720" value="5" />
    <button class="btn-lock" onclick="generateLockQR()">1. Generate Lock QR</button>
    <button id="btnUnlock" class="btn-unlock" onclick="showUnlockQR()">2. Show Unlock QR</button>
    <div id="qrStatus"></div>
    <div id="qrContainer"></div>
  </div>

  <script>
    let currentSecret = null;

    // Pure-JS SHA-256 (works reliably on local file:// URLs where crypto.subtle is unavailable)
    function sha256Hex(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const utf8 = unescape(encodeURIComponent(ascii));
      const maxWord = Math.pow(2, 32);
      const lengthProperty = 'length';
      let i, j;
      let result = '';
      const words = [];
      const asciiBitLength = utf8[lengthProperty] * 8;
      const hash = [];
      const k = [];
      let primeCounter = 0;
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      let padded = utf8 + '\x80';
      while ((padded[lengthProperty] % 64) - 56) padded += '\x00';
      for (i = 0; i < padded[lengthProperty]; i++) {
        j = padded.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = asciiBitLength;
      for (j = 0; j < words[lengthProperty]; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash.slice(0);
        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = hash[0], e = hash[4];
          const temp1 = hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash.unshift((temp1 + temp2) | 0);
          hash[4] = (hash[4] + temp1) | 0;
          hash.pop();
        }
        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    function renderQR(text, label) {
      const container = document.getElementById('qrContainer');
      container.innerHTML = '';
      new QRCode(container, { text: text, width: 256, height: 256 });
      document.getElementById('qrStatus').textContent = label;
    }

    function generateLockQR() {
      const mins = Math.max(1, parseInt(document.getElementById('minutes').value || '5', 10));
      currentSecret = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ('sec-' + Math.random().toString(36).slice(2) + '-' + Date.now());
      const hash = sha256Hex(currentSecret);
      const payload = JSON.stringify({ duration_sec: mins * 60, unlock_hash: hash });
      renderQR(payload, `LOCK QR (${mins} min) — Scan with MeetingLock on your Pixel 7a`);
      document.getElementById('btnUnlock').style.display = 'block';
    }

    function showUnlockQR() {
      if (!currentSecret) return;
      renderQR(currentSecret, 'UNLOCK QR — Scan on Pixel 7a to exit lock early');
    }
  </script>
</body>
</html>
